client_id = "d09d52c9b7333be063b0cb2507bad905"
name = "damirs-test-app"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[access_scopes]
scopes = "write_products,write_orders"

[auth]
redirect_urls = ["https://example.com/api/auth"]

# SIDEKICK
[sidekick]
extensions_summary = "Search, create, edit tickets with titles, descriptions, and completion status"

# NEXT GEN EVENTS
[events]
api_version = "unstable"

# PRODUCT PRICE UPDATE EVENT
[[events.subscription]]
handle = "update_product_price_event"

topic = "Product"
actions = ["update"]

triggers = [
  "product.variants.price",
  "product.variants.compareAtPrice"
]

uri = "/events/product/price"

query = """
  query price_change($productId: ID!, $variantsId: ID!){
    productVariant(id: $variantsId) {
      id
      price
      compareAtPrice
    }
    product(id: $productId) {
      id
      title
      status
    }
  }
  """

query_filter = "product.status:'ACTIVE' AND productVariant.price:>50"

# PRODUCT TITLE UPDATE EVENT
[[events.subscription]]
handle = "update_product_title_event"

topic = "Product"
actions = ["update"]

triggers = [
  "product.title",
]

uri = "/events/product/title"

query = """
  query title_change($productId: ID!){
    product(id: $productId) {
      id
      title
      status
    }
  }
  """

query_filter = "product.status:'ACTIVE'"
