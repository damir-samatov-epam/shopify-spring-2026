api_version = "2026-04"

[[extensions]]
# Change the merchant-facing name of the extension in locales/en.default.json
name = "t:name"
handle = "ticket-actions"
type = "ui_extension"
uid = "cc1050e5-1485-ad1c-b5c8-8c4db9a39923894209ea"
description = "t:description"

[[extensions.targeting]]
module = "./src/IntentExtension.jsx"
target = "admin.app.intent.render"

# Tools Sidekick can invoke while the ticket UI is open (save, delete).
tools = "./tools.json"

# Guidance for Sidekick on when/how to use the intents and tools.
instructions = "./instructions.md"

# application/ticket supports the `create` and `edit` actions.
# Deletion is exposed through the `delete_ticket` tool (see tools.json),
# because `delete` is not a supported intent action for this type.
[[extensions.targeting.intents]]
type = "application/ticket"
action = "create"
schema = "./ticket-create-schema.json"

[[extensions.targeting.intents]]
type = "application/ticket"
action = "edit"
schema = "./ticket-edit-schema.json"
